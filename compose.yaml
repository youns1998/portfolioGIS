services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio-demo-only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - gis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  gis_data:
